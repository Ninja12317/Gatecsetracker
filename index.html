      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var VALID = {
            brown: 1,
            green: 1,
            red: 1,
            blue: 1,
            teal: 1,
            graphite: 1,
            navy: 1,
            olive: 1,
          };
          var mode = 'light';
          var accent = '';
          var directAccent = localStorage.getItem('gate27_accent_theme');
          if (directAccent && VALID[directAccent]) {
            accent = directAccent;
          }
          var bootRaw = localStorage.getItem('gate27_theme_boot_v1');
          if (bootRaw) {
            var boot = JSON.parse(bootRaw);
            if (boot && typeof boot === 'object') {
              if (boot.mode === 'dark' || boot.mode === 'light' || boot.mode === 'system') {
                mode = boot.mode;
              }
              if (!accent && boot.accent && VALID[boot.accent]) {
                accent = boot.accent;
              }
            }
          }
          if (!accent || !bootRaw) {
            var stateRaw = localStorage.getItem('gate27_war_room_state_v2');
            if (stateRaw) {
              var st = JSON.parse(stateRaw);
              if (st && st.settings) {
                if (
                  !bootRaw &&
                  (st.settings.themeMode === 'dark' ||
                    st.settings.themeMode === 'light' ||
                    st.settings.themeMode === 'system')
                ) {
                  mode = st.settings.themeMode;
                }
                if (!accent && st.settings.accentTheme && VALID[st.settings.accentTheme]) {
                  accent = st.settings.accentTheme;
                }
              } else if (!bootRaw && st && st.theme === 'dark') {
                mode = 'dark';
              }
            }
          }
          if (!accent) {
            accent = 'brown';
          }
          var isDark =
            mode === 'dark' ||
            (mode === 'system' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          root.classList.toggle('dark', Boolean(isDark));
          root.setAttribute('data-accent', accent);
        } catch (_err) {
          document.documentElement.setAttribute('data-accent', 'brown');
        }
      })();
    </script>
  </head>
  <body class="bg-[var(--canvas-bg)] text-[var(--ink-primary)] antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
